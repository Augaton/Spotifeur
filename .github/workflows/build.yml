name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "protocol/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "protocol/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK; add the platform this project compiles against.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Spotify engine comes from a user-supplied APKM and is never available in CI.
      # This build compiles everything else, runs the JVM tests and lint.
      - name: Build, test and lint
        run: ./gradlew --no-daemon -PnativeRuntime=false :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APK (without the native engine)
        uses: actions/upload-artifact@v4
        with:
          name: spotifeur-debug-no-engine
          path: app/build/outputs/apk/debug/app-debug.apk
